<ion-header class="ion-no-border">
  <ion-toolbar class="auth-toolbar">
  </ion-toolbar>
</ion-header>

<ion-content class="auth-content">

  <!-- Fondo decorativo -->
  <div class="hero-bg">
    <div class="grid-lines"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Logo -->
  <div class="logo-area">
    <div class="logo-icon">🎮</div>
    <h1 class="logo-title">Game<span>Survey</span></h1>
    <p class="logo-sub">Campus Edition · ESFOT</p>
  </div>

  <!-- Card del formulario -->
  <div class="form-card">

    <h2 class="form-title">Iniciar Sesión</h2>

    <!-- Correo -->
    <div class="field">
      <label class="field-label">Correo electrónico</label>
      <div class="input-wrapper">
        <ion-icon name="mail-outline" class="input-icon"></ion-icon>
        <ion-input
          type="email"
          placeholder="gamer@esfot.edu.ec"
          [(ngModel)]="email"
          class="custom-input">
        </ion-input>
      </div>
    </div>

    <!-- Contraseña -->
    <div class="field">
      <label class="field-label">Contraseña</label>
      <div class="input-wrapper">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input
          type="password"
          placeholder="••••••••"
          [(ngModel)]="password"
          class="custom-input">
        </ion-input>
      </div>
    </div>

    <!-- Botón login -->
    <ion-button
      expand="block"
      class="btn-primary"
      (click)="login()">
      ▶ &nbsp;Ingresar
    </ion-button>

    <!-- Divider -->
    <div class="divider">
      <hr/><span>¿No tienes cuenta?</span><hr/>
    </div>

    <!-- Botón registro -->
    <ion-button
      expand="block"
      fill="outline"
      class="btn-outline"
      routerLink="/register">
      Registrarse
    </ion-button>

  </div>

</ion-content>
