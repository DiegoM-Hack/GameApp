<ion-header class="ion-no-border">
  <ion-toolbar class="profile-toolbar">
    <ion-title class="profile-toolbar-title">Mi Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" class="logout-btn">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-content">

  <!-- Fondo decorativo -->
  <div class="hero-bg">
    <div class="grid-lines"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Spinner de carga -->
  <div class="loading-area" *ngIf="isLoading">
    <ion-spinner name="crescent" class="neon-spinner"></ion-spinner>
    <p>Cargando perfil...</p>
  </div>

  <div *ngIf="!isLoading">

    <!-- Avatar + nombre -->
    <div class="avatar-section">

      <div class="avatar-wrapper" (click)="pickImage()">
        <img
          *ngIf="avatarUrl"
          [src]="avatarUrl"
          class="avatar-img"
          alt="Avatar" />
        <div class="avatar-placeholder" *ngIf="!avatarUrl">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="avatar-edit-badge">
          <ion-icon name="camera-outline"></ion-icon>
        </div>
        <div class="avatar-ring"></div>
      </div>

      <h2 class="profile-name">{{ profile?.nombre || 'Gamer' }}</h2>
      <span class="profile-badge">🎮 GameSurvey Player</span>

    </div>

    <!-- Tarjeta de info -->
    <div class="info-card">

      <h3 class="card-section-title">
        <ion-icon name="information-circle-outline"></ion-icon>
        Información de cuenta
      </h3>

      <div class="info-row">
        <div class="info-icon-wrap">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="info-content">
          <span class="info-label">Nombre</span>
          <span class="info-value">{{ profile?.nombre || '—' }}</span>
        </div>
      </div>

      <div class="info-divider"></div>

      <div class="info-row">
        <div class="info-icon-wrap">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <div class="info-content">
          <span class="info-label">Correo electrónico</span>
          <span class="info-value">{{ profile?.email || '—' }}</span>
        </div>
      </div>

      <div class="info-divider"></div>

      <div class="info-row">
        <div class="info-icon-wrap">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>
        <div class="info-content">
          <span class="info-label">Estado</span>
          <span class="info-value status-active">● Activo</span>
        </div>
      </div>

      <div class="info-divider"></div>

      <div class="info-row">
        <div class="info-icon-wrap">
          <ion-icon name="calendar-outline"></ion-icon>
        </div>
        <div class="info-content">
          <span class="info-label">Miembro desde</span>
          <span class="info-value">{{ createdAt }}</span>
        </div>
      </div>

    </div>

    <!-- Botón subir foto -->
    <div class="action-area">
      <ion-button
        expand="block"
        class="btn-upload"
        (click)="pickImage()"
        [disabled]="isUploading">
        <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
        <span *ngIf="!isUploading">Cambiar foto de perfil</span>
        <ion-spinner *ngIf="isUploading" name="crescent"></ion-spinner>
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        class="btn-logout"
        (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        Cerrar sesión
      </ion-button>
    </div>

  </div>

</ion-content>
