<ion-header class="ion-no-border">

  <ion-toolbar class="posts-toolbar">

    <ion-title class="posts-toolbar-title">
      Publicaciones
    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content class="posts-content">

  <!-- Fondo decorativo -->
  <div class="hero-bg">
    <div class="grid-lines"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Publicaciones -->
  <div class="posts-wrapper">

    <div
      class="post-card"
      *ngFor="let encuesta of encuestas">

      <!-- Imagen -->
      <div class="post-image-wrapper">

        <img

          *ngIf="encuesta.imagen"

          [src]="encuesta.imagen"

          alt="Videojuego"

          class="post-image"

        />
        <br> <br>
        <div class="game-badge">
          🎮
          {{ encuesta.videojuego?.titulo }}

        </div>

      </div>

      <!-- Body -->
      <div class="post-body">

        <!-- Usuario -->
        <div class="user-row">

          <div class="user-avatar">

            <ion-icon
              name="person-outline">
            </ion-icon>

          </div>

          <div class="user-info">

            <span class="user-name">

              {{ encuesta.nombre }}

            </span>

            <span class="post-date">

              {{ encuesta.fecha }}

            </span>

          </div>

        </div>

        <!-- Información -->
        <div class="post-info">

          <div class="info-item">

            <ion-icon
              name="location-outline">
            </ion-icon>

            <span>

              {{ encuesta.latitud }},
              {{ encuesta.longitud }}

            </span>

          </div>

          <div class="info-item">

            <ion-icon
              name="game-controller-outline">
            </ion-icon>

            <span>

              {{ encuesta.videojuego?.genero }}

            </span>

          </div>

        </div>

        <!-- Comentario -->
        <p class="post-comment">

          {{ encuesta.comentario }}

        </p>

      </div>

    </div>

  </div>

</ion-content>
