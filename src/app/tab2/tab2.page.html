<ion-header class="ion-no-border">
  <ion-toolbar class="posts-toolbar">
    <ion-title class="posts-toolbar-title">
      Publicaciones
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="posts-content">

  <!-- Fondo decorativo -->
  <div class="hero-bg">
    <div class="grid-lines"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Contenido -->
  <div class="posts-wrapper">

  <!-- CARD -->
  <div
    class="post-card"
    *ngFor="let survey of surveys">

    <!-- IMAGEN -->
    <div class="post-image-wrapper">

      <img
        [src]="survey.imagen || 'assets/default.jpg'"
        class="post-image"
      />

      <div class="game-badge">

        🎮
        {{ survey.videojuego.titulo }}

      </div>

    </div>

    <!-- BODY -->
    <div class="post-body">

      <!-- USER -->
      <div class="user-row">

        <div class="user-avatar">

          <ion-icon
            name="person-outline">
          </ion-icon>

        </div>

        <div class="user-info">

          <span class="user-name">

            {{ survey.nombre }}

          </span>

          <span class="post-date">

            {{ survey.fecha }}

          </span>

        </div>

      </div>

      <!-- INFO -->
      <div class="post-info">

        <div class="info-item">

          <ion-icon
            name="location-outline">
          </ion-icon>

          <span>

            {{ survey.lugar || 'Campus' }}

          </span>

        </div>

      </div>

      <!-- COMENTARIO -->
      <p class="post-comment">

        {{ survey.comentario }}

      </p>

    </div>

  </div>

</div>

</ion-content>
