<ion-header class="ion-no-border">

  <ion-toolbar class="posts-toolbar">

    <ion-title class="posts-toolbar-title">
      Publicaciones
    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content class="posts-content">

  <!-- Fondo decorativo -->
  <div class="hero-bg">
    <div class="grid-lines"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Publicaciones -->
  <div class="posts-wrapper">

  <!-- CARD -->
  <div
    class="post-card"
    *ngFor="let encuesta of encuestas">

    <!-- IMAGEN -->
    <div class="post-image-wrapper">

      <img
        [src]="encuesta.imagen ? encuesta.imagen : 'https://ionicframework.com/docs/img/demos/thumbnail.svg'"
        class="post-image"
      />

      <div class="game-badge">

        🎮
        {{ encuesta.videojuego.titulo }}

      </div>

    </div>

    <!-- BODY -->
    <div class="post-body">

      <!-- USER -->
      <div class="user-row">

        <div class="user-avatar">

          <ion-icon
            name="person-outline">
          </ion-icon>

        </div>

        <div class="user-info">

          <span class="user-name">

            {{ encuesta.nombre }}

          </span>

          <span class="post-date">

            {{ encuesta.fecha }}

          </span>

        </div>

      </div>

      <!-- INFO -->
      <div class="post-info">

        <div class="info-item">

          <ion-icon
            name="location-outline">
          </ion-icon>

          <span>

            {{ encuesta.lugar || 'Campus' }}

          </span>

        </div>

      </div>

      <!-- COMENTARIO -->
      <p class="post-comment">

        {{ encuesta.comentario }}

      </p>

    </div>

  </div>

</div>

</ion-content>
